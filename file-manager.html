<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端文件管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.13.2/dist/av-min.js"></script>
    <style>
        :root {
            --primary-color: #4a6cf7;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --dark-bg: #0f1421;
            --card-bg: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --text-color: #e9ecef;
            --border-radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f1421 0%, #1a2332 100%);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-effect {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* 侧边栏样式 */
        .sidebar {
            width: 250px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            margin-top: 60px; /* 增加顶部间距，避免被返回按钮遮挡 */
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(90deg, #4a6cf7, #6f42c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item i {
            width: 20px;
            text-align: center;
        }

        /* 主内容区样式 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            border-radius: 30px;
            padding: 8px 15px;
            width: 300px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            width: 100%;
            padding: 5px 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* 文件操作栏 */
        .file-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            position: relative;
        }

        .btn {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.85rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* 文件列表样式 */
        .file-list-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .file-list-header {
            display: grid;
            grid-template-columns: 3fr 1fr 1fr 1fr 1.5fr;
            gap: 15px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-top-left-radius: var(--border-radius);
            border-top-right-radius: var(--border-radius);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            border-bottom-left-radius: var(--border-radius);
            border-bottom-right-radius: var(--border-radius);
            max-height: calc(100vh - 300px);
        }

        .file-list-item {
            display: grid;
            grid-template-columns: 3fr 1fr 1fr 1fr 1.5fr;
            gap: 15px;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.3s ease;
            align-items: center;
        }

        .file-list-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .file-name {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .file-icon {
            font-size: 1.2rem;
        }

        .file-actions-buttons {
            display: flex;
            gap: 8px;
        }

        /* 登录模态框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            width: 400px;
            padding: 30px;
            border-radius: var(--border-radius);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin-bottom: 10px;
            background: linear-gradient(90deg, #4a6cf7, #6f42c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px 15px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        /* 文件预览模态框 */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .preview-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: var(--border-radius);
            overflow: auto;
            background: white;
            padding: 20px;
        }

        .preview-content img {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }

        .preview-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2001;
        }

        /* 上传进度条 */
        .upload-progress {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .upload-progress-bar {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--secondary-color);
        }

        /* 拖拽上传区域 */
        .drop-zone {
            width: 100%;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: var(--border-radius);
            padding: 40px 20px;
            text-align: center;
            margin: 20px 0;
            transition: all 0.3s ease;
        }

        .drop-zone.active {
            border-color: var(--primary-color);
            background: rgba(74, 108, 247, 0.1);
        }

        .drop-zone i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        /* 文件排序控件 */
        .sort-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sort-select {
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 6px;
            outline: none;
        }

        /* 分享模态框 */
        .share-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .share-content {
            width: 500px;
            padding: 30px;
            border-radius: var(--border-radius);
        }

        .share-link {
            display: flex;
            margin: 20px 0;
        }

        .share-link input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 6px 0 0 6px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            outline: none;
        }

        .share-link button {
            border-radius: 0 6px 6px 0;
        }

        /* 批量操作栏 */
        .batch-actions {
            display: none;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            margin-bottom: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .batch-actions.active {
            display: flex;
        }

        .batch-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .batch-buttons {
            display: flex;
            gap: 10px;
        }

        /* 复选框样式 */
        .file-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* 上传模态框 */
        .upload-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .upload-content {
            width: 500px;
            padding: 30px;
            border-radius: var(--border-radius);
        }

        .upload-options {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .upload-option {
            flex: 1;
            text-align: center;
            padding: 15px;
            border-radius: var(--border-radius);
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-option:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .upload-option.active {
            background: rgba(74, 108, 247, 0.2);
            border: 1px solid var(--primary-color);
        }

        .upload-option i {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
            }
            
            .file-list-header, .file-list-item {
                grid-template-columns: 2fr 1fr 1fr 1fr 1.5fr;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
            }
            
            .search-bar {
                width: 100%;
            }
            
            .file-actions {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .sort-controls {
                width: 100%;
                justify-content: flex-end;
            }
            
            .batch-actions {
                flex-direction: column;
                gap: 15px;
            }
            
            .upload-content {
                width: 90%;
            }
        }

        /* 消息提示 */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: var(--border-radius);
            background: var(--primary-color);
            color: white;
            z-index: 3000;
            transform: translateX(150%);
            transition: transform 0.3s ease;
        }

        .message.show {
            transform: translateX(0);
        }

        .message.error {
            background: var(--danger-color);
        }

        .message.success {
            background: var(--success-color);
        }

        /* 返回主页按钮 */
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <!-- 返回主页按钮 -->
    <a href="index.html" class="home-btn glass-effect">
        <i class="fas fa-home"></i>
        <span>返回主页</span>
    </a>

    <!-- 登录模态框 -->
    <div id="loginModal" class="modal">
        <div class="modal-content glass-effect">
            <div class="modal-header">
                <h2>云端文件管理系统</h2>
                <p>请登录您的账户</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" class="form-control" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
                </div>
                <div class="modal-footer">
                    <button type="button" id="registerBtn" class="btn btn-secondary">注册</button>
                    <button type="submit" class="btn btn-primary">登录</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 主界面 -->
    <div class="container" id="mainContainer" style="display: none;">
        <!-- 侧边栏 -->
        <div class="sidebar glass-effect">
            <div class="logo">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-cloud"></i>
                    <h1>云端文件管理</h1>
                </div>
            </div>
            <div class="nav-menu">
                <div class="nav-item active" data-category="all">
                    <i class="fas fa-folder"></i>
                    <span>全部文件</span>
                </div>
                <div class="nav-item" data-category="image">
                    <i class="fas fa-image"></i>
                    <span>图片</span>
                </div>
                <div class="nav-item" data-category="document">
                    <i class="fas fa-file-alt"></i>
                    <span>文档</span>
                </div>
                <div class="nav-item" data-category="audio">
                    <i class="fas fa-music"></i>
                    <span>音频</span>
                </div>
                <div class="nav-item" data-category="video">
                    <i class="fas fa-video"></i>
                    <span>视频</span>
                </div>
                <div class="nav-item" data-category="archive">
                    <i class="fas fa-file-archive"></i>
                    <span>压缩包</span>
                </div>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部栏 -->
            <div class="header glass-effect">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="搜索文件...">
                </div>
                <div class="user-info">
                    <div class="avatar" id="userAvatar">U</div>
                    <span id="userName">用户</span>
                    <button class="btn btn-secondary" id="logoutBtn" style="margin-left: 10px;">退出</button>
                </div>
            </div>

            <!-- 批量操作栏 -->
            <div class="batch-actions glass-effect" id="batchActions">
                <div class="batch-info">
                    <span id="selectedCount">已选择 0 个文件</span>
                    <button class="btn btn-secondary" id="selectAllBtn">全选</button>
                    <button class="btn btn-secondary" id="clearSelectionBtn">取消选择</button>
                </div>
                <div class="batch-buttons">
                    <button class="btn btn-primary" id="batchDownloadBtn">
                        <i class="fas fa-download"></i> 批量下载
                    </button>
                    <button class="btn btn-danger" id="batchDeleteBtn">
                        <i class="fas fa-trash"></i> 批量删除
                    </button>
                </div>
            </div>

            <!-- 文件操作栏 -->
            <div class="file-actions glass-effect">
                <div class="action-buttons">
                    <button class="btn btn-primary" id="uploadBtn">
                        <i class="fas fa-upload"></i> 上传文件
                    </button>
                    <button class="btn btn-primary" id="newFolderBtn">
                        <i class="fas fa-folder-plus"></i> 新建文件夹
                    </button>
                    <button class="btn btn-secondary" id="batchManageBtn">
                        <i class="fas fa-tasks"></i> 批量管理
                    </button>
                </div>
                <div class="sort-controls">
                    <span>排序:</span>
                    <select id="sortSelect" class="sort-select">
                        <option value="name">按名称</option>
                        <option value="size">按大小</option>
                        <option value="type">按类型</option>
                        <option value="date">按日期</option>
                    </select>
                </div>
            </div>

            <!-- 文件列表 -->
            <div class="file-list-container glass-effect">
                <div class="file-list-header">
                    <div>文件名</div>
                    <div>大小</div>
                    <div>类型</div>
                    <div>分类</div>
                    <div>操作</div>
                </div>
                <div class="file-list" id="fileList">
                    <!-- 文件列表将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 文件预览模态框 -->
    <div class="preview-modal" id="previewModal">
        <button class="preview-close" id="previewClose">×</button>
        <div class="preview-content" id="previewContent">
            <!-- 预览内容将在这里显示 -->
        </div>
    </div>

    <!-- 上传文件模态框 -->
    <div class="upload-modal" id="uploadModal">
        <div class="upload-content glass-effect">
            <div class="modal-header">
                <h2>上传文件</h2>
                <p>选择上传方式</p>
            </div>
            <div class="upload-options">
                <div class="upload-option active" id="browseOption">
                    <i class="fas fa-folder-open"></i>
                    <h3>浏览文件</h3>
                    <p>从本地选择文件</p>
                </div>
                <div class="upload-option" id="dragOption">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <h3>拖拽上传</h3>
                    <p>拖拽文件到此处</p>
                </div>
            </div>
            
            <!-- 浏览文件区域 -->
            <div id="browseArea">
                <div class="form-group">
                    <button class="btn btn-primary" id="selectFilesBtn" style="width: 100%;">
                        <i class="fas fa-folder-open"></i> 选择文件
                    </button>
                </div>
                <div id="selectedFilesList" style="max-height: 200px; overflow-y: auto; margin-top: 15px;"></div>
            </div>
            
            <!-- 拖拽上传区域 -->
            <div id="dragArea" style="display: none;">
                <div class="drop-zone glass-effect" id="dropZone">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <h3>拖拽文件到此处上传</h3>
                    <p>支持单个或多个文件上传</p>
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelUploadBtn">取消</button>
                <button class="btn btn-primary" id="confirmUploadBtn">开始上传</button>
            </div>
        </div>
    </div>

    <!-- 分享模态框 -->
    <div class="share-modal" id="shareModal">
        <div class="share-content glass-effect">
            <div class="modal-header">
                <h2>分享文件</h2>
                <p id="shareFileName">文件名</p>
            </div>
            <div class="share-link">
                <input type="text" id="shareLink" readonly>
                <button class="btn btn-primary" id="copyLinkBtn">
                    <i class="fas fa-copy"></i> 复制
                </button>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="closeShareBtn">关闭</button>
                <button class="btn btn-primary" id="generateShareBtn">生成新链接</button>
            </div>
        </div>
    </div>

    <!-- 隐藏的文件上传输入 -->
    <input type="file" id="fileInput" style="display: none;" multiple>

    <!-- 消息提示 -->
    <div class="message" id="message"></div>

    <script>
        // LeanCloud 初始化
        const APP_ID = 'YCLFSSQlNHQTWPCJdgvxdLHu-gzGzoHsz';
        const APP_KEY = 'gkGobpPGAlbagBRXWRtzFnxy';
        
        AV.init({
            appId: APP_ID,
            appKey: APP_KEY,
            serverURLs: 'https://api1.rtcus.cn'
        });

        // 全局变量
        let currentUser = null;
        let currentCategory = 'all';
        let allFiles = [];
        let sortBy = 'name';
        let selectedFiles = new Set();
        let batchMode = false;
        let filesToUpload = [];

        // DOM 元素
        const loginModal = document.getElementById('loginModal');
        const mainContainer = document.getElementById('mainContainer');
        const loginForm = document.getElementById('loginForm');
        const registerBtn = document.getElementById('registerBtn');
        const fileList = document.getElementById('fileList');
        const searchInput = document.getElementById('searchInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const newFolderBtn = document.getElementById('newFolderBtn');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const logoutBtn = document.getElementById('logoutBtn');
        const fileInput = document.getElementById('fileInput');
        const previewModal = document.getElementById('previewModal');
        const previewContent = document.getElementById('previewContent');
        const previewClose = document.getElementById('previewClose');
        const sortSelect = document.getElementById('sortSelect');
        const shareModal = document.getElementById('shareModal');
        const shareLink = document.getElementById('shareLink');
        const shareFileName = document.getElementById('shareFileName');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const closeShareBtn = document.getElementById('closeShareBtn');
        const generateShareBtn = document.getElementById('generateShareBtn');
        const message = document.getElementById('message');
        const batchActions = document.getElementById('batchActions');
        const batchManageBtn = document.getElementById('batchManageBtn');
        const selectedCount = document.getElementById('selectedCount');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const clearSelectionBtn = document.getElementById('clearSelectionBtn');
        const batchDownloadBtn = document.getElementById('batchDownloadBtn');
        const batchDeleteBtn = document.getElementById('batchDeleteBtn');
        const uploadModal = document.getElementById('uploadModal');
        const browseOption = document.getElementById('browseOption');
        const dragOption = document.getElementById('dragOption');
        const browseArea = document.getElementById('browseArea');
        const dragArea = document.getElementById('dragArea');
        const selectFilesBtn = document.getElementById('selectFilesBtn');
        const selectedFilesList = document.getElementById('selectedFilesList');
        const dropZone = document.getElementById('dropZone');
        const cancelUploadBtn = document.getElementById('cancelUploadBtn');
        const confirmUploadBtn = document.getElementById('confirmUploadBtn');

        // 页面加载时检查登录状态
        document.addEventListener('DOMContentLoaded', function() {
            // 检查是否有已登录用户
            currentUser = AV.User.current();
            if (currentUser) {
                showMainInterface();
                loadFiles();
            } else {
                loginModal.style.display = 'flex';
            }
        });

        // 显示消息提示
        function showMessage(text, type = 'info') {
            message.textContent = text;
            message.className = 'message ' + type;
            message.classList.add('show');
            
            setTimeout(() => {
                message.classList.remove('show');
            }, 3000);
        }

        // 登录表单提交
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showMessage('请输入用户名和密码', 'error');
                return;
            }
            
            // LeanCloud 用户登录
            AV.User.logIn(username, password).then(function(user) {
                currentUser = user;
                showMainInterface();
                loadFiles();
                showMessage('登录成功', 'success');
            }).catch(function(error) {
                console.error('登录失败:', error);
                showMessage('登录失败: ' + error.message, 'error');
            });
        });

        // 注册按钮点击
        registerBtn.addEventListener('click', function() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showMessage('请输入用户名和密码', 'error');
                return;
            }
            
            // LeanCloud 用户注册
            const user = new AV.User();
            user.setUsername(username);
            user.setPassword(password);
            
            user.signUp().then(function(user) {
                showMessage('注册成功，请登录', 'success');
                document.getElementById('password').value = '';
            }).catch(function(error) {
                console.error('注册失败:', error);
                showMessage('注册失败: ' + error.message, 'error');
            });
        });

        // 退出登录
        logoutBtn.addEventListener('click', function() {
            AV.User.logOut();
            currentUser = null;
            mainContainer.style.display = 'none';
            loginModal.style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            showMessage('已退出登录', 'info');
        });

        // 显示主界面
        function showMainInterface() {
            loginModal.style.display = 'none';
            mainContainer.style.display = 'flex';
            userName.textContent = currentUser.getUsername();
            userAvatar.textContent = currentUser.getUsername().charAt(0).toUpperCase();
        }

        // 加载文件列表
        function loadFiles() {
            // 使用 fileType 类名查询文件记录
            const FileType = AV.Object.extend('fileType');
            const query = new AV.Query('fileType');
            query.equalTo('owner', currentUser);
            
            query.find().then(function(files) {
                allFiles = files.map(file => {
                    return {
                        id: file.id,
                        name: file.get('name'),
                        size: file.get('size'),
                        type: file.get('type'),
                        category: file.get('category'),
                        icon: getFileIcon(file.get('name')),
                        date: file.createdAt.toISOString().split('T')[0],
                        url: file.get('url')
                    };
                });
                
                renderFiles(allFiles);
            }).catch(function(error) {
                console.error('加载文件失败:', error);
                showMessage('加载文件失败: ' + error.message, 'error');
            });
        }

        // 渲染文件列表
        function renderFiles(files) {
            fileList.innerHTML = '';
            
            if (files.length === 0) {
                fileList.innerHTML = '<div class="loading">暂无文件，请上传文件</div>';
                return;
            }
            
            // 根据当前分类过滤文件
            const filteredFiles = files.filter(file => {
                if (currentCategory === 'all') return true;
                return file.category === currentCategory;
            });
            
            // 排序文件
            const sortedFiles = sortFiles(filteredFiles);
            
            sortedFiles.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-list-item';
                fileItem.setAttribute('data-id', file.id);
                
                const fileSize = formatFileSize(file.size);
                const fileCategory = getCategoryName(file.category);
                
                fileItem.innerHTML = `
                    <div class="file-name">
                        ${batchMode ? `<input type="checkbox" class="file-checkbox" data-id="${file.id}">` : ''}
                        <span class="file-icon"><i class="${file.icon}"></i></span>
                        <span title="${file.name}">${file.name}</span>
                    </div>
                    <div>${fileSize}</div>
                    <div>${file.type}</div>
                    <div>${fileCategory}</div>
                    <div class="file-actions-buttons">
                        <button class="btn btn-secondary btn-sm share-btn">
                            <i class="fas fa-share-alt"></i> 分享
                        </button>
                        <button class="btn btn-secondary btn-sm download-btn">
                            <i class="fas fa-download"></i> 下载
                        </button>
                        <button class="btn btn-danger btn-sm delete-btn">
                            <i class="fas fa-trash"></i> 删除
                        </button>
                    </div>
                `;
                
                // 添加事件监听器
                const fileNameElement = fileItem.querySelector('.file-name');
                const shareBtn = fileItem.querySelector('.share-btn');
                const downloadBtn = fileItem.querySelector('.download-btn');
                const deleteBtn = fileItem.querySelector('.delete-btn');
                
                fileNameElement.addEventListener('click', (e) => {
                    // 如果是在批量模式下，点击文件名不打开文件，而是选中/取消选中
                    if (batchMode && !e.target.classList.contains('file-checkbox')) {
                        const checkbox = fileItem.querySelector('.file-checkbox');
                        checkbox.checked = !checkbox.checked;
                        toggleFileSelection(file.id, checkbox.checked);
                    } else if (!batchMode) {
                        openFile(file);
                    }
                });
                
                shareBtn.addEventListener('click', () => shareFile(file));
                downloadBtn.addEventListener('click', () => downloadFile(file));
                deleteBtn.addEventListener('click', () => deleteFile(file));
                
                // 批量模式下的复选框事件
                if (batchMode) {
                    const checkbox = fileItem.querySelector('.file-checkbox');
                    checkbox.addEventListener('change', (e) => {
                        toggleFileSelection(file.id, e.target.checked);
                    });
                    
                    // 如果文件已被选中，设置复选框为选中状态
                    if (selectedFiles.has(file.id)) {
                        checkbox.checked = true;
                    }
                }
                
                fileList.appendChild(fileItem);
            });
        }

        // 排序文件
        function sortFiles(files) {
            return [...files].sort((a, b) => {
                switch(sortBy) {
                    case 'name':
                        return a.name.localeCompare(b.name);
                    case 'size':
                        return b.size - a.size;
                    case 'type':
                        return a.type.localeCompare(b.type);
                    case 'date':
                        return new Date(b.date) - new Date(a.date);
                    default:
                        return 0;
                }
            });
        }

        // 获取分类名称
        function getCategoryName(category) {
            const categoryNames = {
                'all': '全部',
                'image': '图片',
                'document': '文档',
                'audio': '音频',
                'video': '视频',
                'archive': '压缩包',
                'other': '其他'
            };
            return categoryNames[category] || '其他';
        }

        // 打开文件
        function openFile(file) {
            console.log('打开文件:', file.name);
            
            if (file.category === 'image') {
                // 图片预览
                previewContent.innerHTML = `
                    <div style="text-align: center;">
                        <h3>${file.name}</h3>
                        <img src="${file.url}" alt="${file.name}" style="max-width: 100%; max-height: 70vh;">
                        <p>图片预览</p>
                    </div>
                `;
                previewModal.style.display = 'flex';
            } else if (file.category === 'document') {
                if (file.type === 'PDF') {
                    // PDF预览 - 在新窗口打开
                    window.open(file.url, '_blank');
                } else {
                    // 其他文档类型提示下载
                    if (confirm('该文件类型不支持预览，是否下载？')) {
                        downloadFile(file);
                    }
                }
            } else {
                // 其他文件类型提示下载
                if (confirm('该文件类型不支持预览，是否下载？')) {
                    downloadFile(file);
                }
            }
        }

        // 分享文件
        function shareFile(file) {
            console.log('分享文件:', file.name);
            shareFileName.textContent = file.name;
            
            // 生成分享链接
            const shareUrl = file.url;
            shareLink.value = shareUrl;
            
            shareModal.style.display = 'flex';
        }

        // 下载文件
        function downloadFile(file) {
            console.log('下载文件:', file.name);
            // 创建隐藏的下载链接
            const downloadLink = document.createElement('a');
            downloadLink.href = file.url;
            downloadLink.download = file.name;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            showMessage(`开始下载: ${file.name}`, 'success');
        }

        // 删除文件
        function deleteFile(file) {
            if (confirm(`确定要删除文件 "${file.name}" 吗？`)) {
                console.log('删除文件:', file.name);
                
                // 从 LeanCloud 删除文件记录
                const FileType = AV.Object.extend('fileType');
                const query = new AV.Query(FileType);
                query.get(file.id).then(function(fileObj) {
                    return fileObj.destroy();
                }).then(function() {
                    // 从本地文件列表中删除
                    allFiles = allFiles.filter(f => f.id !== file.id);
                    renderFiles(allFiles);
                    showMessage('文件删除成功', 'success');
                }).catch(function(error) {
                    console.error('删除文件失败:', error);
                    showMessage('删除文件失败: ' + error.message, 'error');
                });
            }
        }

        // 搜索功能
        searchInput.addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            
            if (!searchTerm) {
                renderFiles(allFiles);
                return;
            }
            
            const filteredFiles = allFiles.filter(file => {
                const fileName = file.name.toLowerCase();
                return fileName.includes(searchTerm);
            });
            
            renderFiles(filteredFiles);
        });

        // 分类导航
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.getAttribute('data-category');
                renderFiles(allFiles);
            });
        });

        // 排序功能
        sortSelect.addEventListener('change', function() {
            sortBy = this.value;
            renderFiles(allFiles);
        });

        // 上传文件按钮点击事件
        uploadBtn.addEventListener('click', function() {
            uploadModal.style.display = 'flex';
            filesToUpload = [];
            selectedFilesList.innerHTML = '';
        });

        // 上传方式选择
        browseOption.addEventListener('click', function() {
            browseOption.classList.add('active');
            dragOption.classList.remove('active');
            browseArea.style.display = 'block';
            dragArea.style.display = 'none';
        });

        dragOption.addEventListener('click', function() {
            dragOption.classList.add('active');
            browseOption.classList.remove('active');
            browseArea.style.display = 'none';
            dragArea.style.display = 'block';
        });

        // 选择文件按钮
        selectFilesBtn.addEventListener('click', function() {
            fileInput.click();
        });

        // 文件选择事件
        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                Array.from(this.files).forEach(file => {
                    addFileToUploadList(file);
                });
                this.value = ''; // 重置文件输入
            }
        });

        // 添加文件到上传列表
        function addFileToUploadList(file) {
            // 检查是否已存在同名文件
            if (filesToUpload.some(f => f.name === file.name)) {
                showMessage(`文件 "${file.name}" 已存在上传列表中`, 'error');
                return;
            }
            
            filesToUpload.push(file);
            
            const fileItem = document.createElement('div');
            fileItem.className = 'file-list-item';
            fileItem.style.gridTemplateColumns = '3fr 1fr 1fr';
            fileItem.innerHTML = `
                <div class="file-name">
                    <span class="file-icon"><i class="${getFileIcon(file.name)}"></i></span>
                    <span title="${file.name}">${file.name}</span>
                </div>
                <div>${formatFileSize(file.size)}</div>
                <div>
                    <button class="btn btn-danger btn-sm remove-file-btn">
                        <i class="fas fa-times"></i> 移除
                    </button>
                </div>
            `;
            
            const removeBtn = fileItem.querySelector('.remove-file-btn');
            removeBtn.addEventListener('click', function() {
                filesToUpload = filesToUpload.filter(f => f !== file);
                fileItem.remove();
            });
            
            selectedFilesList.appendChild(fileItem);
        }

        // 拖拽上传功能
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight() {
            dropZone.classList.add('active');
        }

        function unhighlight() {
            dropZone.classList.remove('active');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            
            if (files.length > 0) {
                Array.from(files).forEach(file => {
                    addFileToUploadList(file);
                });
            }
        }

        // 取消上传
        cancelUploadBtn.addEventListener('click', function() {
            uploadModal.style.display = 'none';
            filesToUpload = [];
        });

        // 确认上传
        confirmUploadBtn.addEventListener('click', function() {
            if (filesToUpload.length === 0) {
                showMessage('请先选择要上传的文件', 'error');
                return;
            }
            
            uploadModal.style.display = 'none';
            
            // 开始上传所有文件
            filesToUpload.forEach(file => {
                uploadFile(file);
            });
            
            filesToUpload = [];
        });

        // 上传文件
        function uploadFile(file) {
            // 创建上传进度显示
            const fileItem = document.createElement('div');
            fileItem.className = 'file-list-item';
            fileItem.innerHTML = `
                <div class="file-name">
                    <span class="file-icon"><i class="fas fa-file-upload"></i></span>
                    <span>${file.name}</span>
                </div>
                <div>${formatFileSize(file.size)}</div>
                <div>${file.name.split('.').pop().toUpperCase()}</div>
                <div>上传中...</div>
                <div>
                    <div class="upload-progress">
                        <div class="upload-progress-bar"></div>
                    </div>
                </div>
            `;
            fileList.prepend(fileItem);
            const progressBar = fileItem.querySelector('.upload-progress-bar');
            const progressContainer = fileItem.querySelector('.upload-progress');
            progressContainer.style.display = 'block';

            // 创建 LeanCloud 文件对象
            const avFile = new AV.File(file.name, file);
            
            // 上传文件并监听进度
            avFile.save({
                onprogress: function(progress) {
                    const percent = Math.round(progress.percent);
                    progressBar.style.width = percent + '%';
                }
            }).then(function(savedFile) {
                // 文件上传成功后，创建文件记录到 fileType 类
                const FileType = AV.Object.extend('fileType');
                const fileObj = new FileType();
                
                fileObj.set('name', file.name);
                fileObj.set('size', file.size);
                fileObj.set('type', file.name.split('.').pop().toUpperCase());
                fileObj.set('category', getFileCategory(file.name));
                fileObj.set('url', savedFile.url());
                fileObj.set('owner', currentUser);
                
                return fileObj.save();
            }).then(function(fileObj) {
                // 上传完成
                progressBar.style.width = '100%';
                
                // 创建新文件记录
                const newFile = {
                    id: fileObj.id,
                    name: file.name,
                    size: file.size,
                    type: file.name.split('.').pop().toUpperCase(),
                    category: getFileCategory(file.name),
                    icon: getFileIcon(file.name),
                    date: fileObj.createdAt.toISOString().split('T')[0],
                    url: fileObj.get('url')
                };
                
                allFiles.unshift(newFile);
                fileItem.remove();
                renderFiles(allFiles);
                showMessage(`文件 "${file.name}" 上传成功`, 'success');
            }).catch(function(error) {
                console.error('上传失败:', error);
                fileItem.remove();
                // 显示详细的错误信息
                let errorMsg = `文件 "${file.name}" 上传失败`;
                if (error.message) {
                    errorMsg += `: ${error.message}`;
                }
                if (error.code) {
                    errorMsg += ` (错误代码: ${error.code})`;
                }
                showMessage(errorMsg, 'error');
            });
        }

        // 根据文件名获取文件分类
        function getFileCategory(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'];
            const documentExts = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt'];
            const audioExts = ['mp3', 'wav', 'ogg', 'flac'];
            const videoExts = ['mp4', 'avi', 'mov', 'wmv', 'flv'];
            const archiveExts = ['zip', 'rar', '7z', 'tar', 'gz'];
            
            if (imageExts.includes(ext)) return 'image';
            if (documentExts.includes(ext)) return 'document';
            if (audioExts.includes(ext)) return 'audio';
            if (videoExts.includes(ext)) return 'video';
            if (archiveExts.includes(ext)) return 'archive';
            return 'other';
        }

        // 根据文件名获取文件图标
        function getFileIcon(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            const iconMap = {
                'pdf': 'fas fa-file-pdf',
                'doc': 'fas fa-file-word',
                'docx': 'fas fa-file-word',
                'xls': 'fas fa-file-excel',
                'xlsx': 'fas fa-file-excel',
                'ppt': 'fas fa-file-powerpoint',
                'pptx': 'fas fa-file-powerpoint',
                'jpg': 'fas fa-file-image',
                'jpeg': 'fas fa-file-image',
                'png': 'fas fa-file-image',
                'gif': 'fas fa-file-image',
                'mp3': 'fas fa-file-audio',
                'wav': 'fas fa-file-audio',
                'mp4': 'fas fa-file-video',
                'avi': 'fas fa-file-video',
                'zip': 'fas fa-file-archive',
                'rar': 'fas fa-file-archive',
                'txt': 'fas fa-file-alt',
                'sql': 'fas fa-database',
                'exe': 'fas fa-file-code'
            };
            return iconMap[ext] || 'fas fa-file';
        }

        // 新建文件夹
        newFolderBtn.addEventListener('click', function() {
            const folderName = prompt('请输入文件夹名称:');
            if (folderName) {
                // 创建文件夹记录
                const FileType = AV.Object.extend('fileType');
                const folderObj = new FileType();
                
                folderObj.set('name', folderName);
                folderObj.set('size', 0);
                folderObj.set('type', '文件夹');
                folderObj.set('category', 'folder');
                folderObj.set('owner', currentUser);
                
                folderObj.save().then(function(savedFolder) {
                    // 创建文件夹记录
                    const newFolder = {
                        id: savedFolder.id,
                        name: folderName,
                        size: 0,
                        type: '文件夹',
                        category: 'folder',
                        icon: 'fas fa-folder',
                        date: savedFolder.createdAt.toISOString().split('T')[0]
                    };
                    
                    allFiles.unshift(newFolder);
                    renderFiles(allFiles);
                    showMessage(`已创建文件夹: ${folderName}`, 'success');
                }).catch(function(error) {
                    console.error('创建文件夹失败:', error);
                    showMessage(`创建文件夹失败: ` + error.message, 'error');
                });
            }
        });

        // 关闭预览
        previewClose.addEventListener('click', function() {
            previewModal.style.display = 'none';
        });

        // 分享功能
        copyLinkBtn.addEventListener('click', function() {
            shareLink.select();
            document.execCommand('copy');
            showMessage('链接已复制到剪贴板', 'success');
        });

        closeShareBtn.addEventListener('click', function() {
            shareModal.style.display = 'none';
        });

        generateShareBtn.addEventListener('click', function() {
            // 生成新的分享链接
            const newShareUrl = `https://cloudfiles.example.com/share/${Date.now()}`;
            shareLink.value = newShareUrl;
            showMessage('已生成新的分享链接', 'success');
        });

        // 工具函数：格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 批量管理功能
        batchManageBtn.addEventListener('click', function() {
            batchMode = !batchMode;
            if (batchMode) {
                batchActions.classList.add('active');
                batchManageBtn.classList.add('btn-primary');
                batchManageBtn.classList.remove('btn-secondary');
                batchManageBtn.innerHTML = '<i class="fas fa-times"></i> 退出批量管理';
            } else {
                batchActions.classList.remove('active');
                batchManageBtn.classList.remove('btn-primary');
                batchManageBtn.classList.add('btn-secondary');
                batchManageBtn.innerHTML = '<i class="fas fa-tasks"></i> 批量管理';
                selectedFiles.clear();
                updateSelectedCount();
            }
            renderFiles(allFiles);
        });

        // 切换文件选择状态
        function toggleFileSelection(fileId, selected) {
            if (selected) {
                selectedFiles.add(fileId);
            } else {
                selectedFiles.delete(fileId);
            }
            updateSelectedCount();
        }

        // 更新已选择文件计数
        function updateSelectedCount() {
            selectedCount.textContent = `已选择 ${selectedFiles.size} 个文件`;
        }

        // 全选按钮
        selectAllBtn.addEventListener('click', function() {
            const checkboxes = document.querySelectorAll('.file-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = true;
                toggleFileSelection(checkbox.getAttribute('data-id'), true);
            });
        });

        // 取消选择按钮
        clearSelectionBtn.addEventListener('click', function() {
            const checkboxes = document.querySelectorAll('.file-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
                toggleFileSelection(checkbox.getAttribute('data-id'), false);
            });
        });

        // 批量下载
        batchDownloadBtn.addEventListener('click', function() {
            if (selectedFiles.size === 0) {
                showMessage('请先选择要下载的文件', 'error');
                return;
            }
            
            // 批量下载选中的文件
            allFiles.forEach(file => {
                if (selectedFiles.has(file.id)) {
                    downloadFile(file);
                }
            });
            
            showMessage(`开始批量下载 ${selectedFiles.size} 个文件`, 'success');
        });

        // 批量删除
        batchDeleteBtn.addEventListener('click', function() {
            if (selectedFiles.size === 0) {
                showMessage('请先选择要删除的文件', 'error');
                return;
            }
            
            if (confirm(`确定要删除选中的 ${selectedFiles.size} 个文件吗？`)) {
                // 批量删除选中的文件
                const deletePromises = [];
                
                allFiles.forEach(file => {
                    if (selectedFiles.has(file.id)) {
                        const FileType = AV.Object.extend('fileType');
                        const query = new AV.Query(FileType);
                        
                        deletePromises.push(
                            query.get(file.id).then(function(fileObj) {
                                return fileObj.destroy();
                            })
                        );
                    }
                });
                
                Promise.all(deletePromises).then(function() {
                    // 从本地文件列表中删除
                    allFiles = allFiles.filter(f => !selectedFiles.has(f.id));
                    selectedFiles.clear();
                    updateSelectedCount();
                    renderFiles(allFiles);
                    showMessage(`已成功删除 ${deletePromises.length} 个文件`, 'success');
                }).catch(function(error) {
                    console.error('批量删除文件失败:', error);
                    showMessage('批量删除文件失败: ' + error.message, 'error');
                });
            }
        });
    </script>
</body>
</html>
