            // 更新移动目标文件夹选择器
            function updateMoveTargetFolder() {
                try {
                    const currentUser = AV.User.current();
                    if (!currentUser || !moveTargetFolder) return;
                    
                    // 使用复合查询获取所有文件夹
                    const userFolderQuery = new AV.Query('Folder');
                    userFolderQuery.equalTo('owner', currentUser);
                    
                    const legacyFolderQuery = new AV.Query('Folder');
                    legacyFolderQuery.doesNotExist('owner');
                    
                    const folderQuery = AV.Query.or(userFolderQuery, legacyFolderQuery);
                    
                    folderQuery.find().then(results => {
                        const allFolders = results.map(folder => ({
                            id: folder.id,
                            name: folder.get('name'),
                            parentFolder: folder.get('parentFolder') || 'root'
                        }));
                        
                        // 排除当前文件夹和选中的文件夹（防止循环移动）
                        const excludedFolders = new Set([currentFolderId, ...Array.from(selectedFileIds)]);
                        const availableFolders = allFolders.filter(folder => !excludedFolders.has(folder.id));
                        
                        // 构建文件夹树
                        const folderTree = buildFolderTree(availableFolders, 'root');
                        
                        // 更新选择器
                        moveTargetFolder.innerHTML = '<option value="root">根目录</option>' + 
                            generateFolderOptions(folderTree);
                    }).catch(error => {
                        console.warn('加载文件夹列表失败:', error.message);
                        moveTargetFolder.innerHTML = '<option value="root">根目录</option>';
                    });
                } catch (error) {
                    console.warn('Folder类不存在:', error.message);
                    if (moveTargetFolder) moveTargetFolder.innerHTML = '<option value="root">根目录</option>';
                }
            }
            
            // 确认移动文件
            if (confirmMove) {
                confirmMove.addEventListener('click', async () => {
                    if (selectedFileIds.size === 0) {
                        showNotification('请先选择要移动的文件！', 'error');
                        return;
                    }
                    
                    const targetFolderId = moveTargetFolder ? moveTargetFolder.value : 'root';
                    
                    if (!targetFolderId) {
                        showNotification('请选择目标文件夹！', 'error');
                        return;
                    }
                    
                    // 保存按钮原始状态
                    const originalHTML = confirmMove.innerHTML;
                    const originalDisabled = confirmMove.disabled;
                    
                    try {
                        confirmMove.innerHTML = '<div class="loading"></div> 移动中...';
                        confirmMove.disabled = true;
                        
                        const fileIds = Array.from(selectedFileIds);
                        let successCount = 0;
                        
                        for (const fileId of fileIds) {
                            try {
                                await moveSingleFile(fileId, targetFolderId);
                                successCount++;
                            } catch (error) {
                                console.error(`移动文件 ${fileId} 失败:`, error);
                            }
                        }
                        
                        if (moveModal) moveModal.style.display = 'none';
                        selectedFileIds.clear();
                        updateSelectedCount();
                        
                        showNotification(`成功移动 ${successCount} 个文件/文件夹！`);
                        loadFiles(); // 重新加载文件列表
                        
                    } catch (error) {
                        console.error('移动文件失败:', error);
                        showNotification('移动文件失败，请重试！', 'error');
                    } finally {
                        // 确保按钮状态恢复
                        confirmMove.innerHTML = originalHTML;
                        confirmMove.disabled = originalDisabled;
                    }
                });
            }
            
            // 移动单个文件/文件夹
            async function moveSingleFile(fileId, targetFolderId) {
                const file = currentFiles.find(f => f.id === fileId);
                if (!file) return;
                
                if (file.type === 'folder') {
                    // 移动文件夹
                    try {
                        const folderObj = AV.Object.createWithoutData('Folder', fileId);
                        folderObj.set('parentFolder', targetFolderId);
                        await folderObj.save();
                    } catch (error) {
                        console.warn('Folder类不存在，尝试使用fileType类移动:', error.message);
                        // 如果Folder类不存在，尝试使用fileType类移动
                        const fileObj = AV.Object.createWithoutData('fileType', fileId);
                        fileObj.set('parentFolder', targetFolderId);
                        await fileObj.save();
                    }
                } else {
                    // 移动文件
                    const fileObj = AV.Object.createWithoutData('fileType', fileId);
                    fileObj.set('parentFolder', targetFolderId);
                    await fileObj.save();
                }
            }
            
            // 预览文件 - 改进的Office文档预览
            async function previewFile(fileId) {
                const file = currentFiles.find(f => f.id === fileId);
                if (!file) return;
                
                if (previewTitle) previewTitle.textContent = `预览: ${file.name}`;
                if (previewBody) previewBody.innerHTML = '<div class="loading"></div><p>加载中...</p>';
                if (previewModal) previewModal.style.display = 'flex';
                
                const fileType = file.type.toLowerCase();
                const fileExt = file.name.split('.').pop().toLowerCase();
                
                try {
                    if (file.category === 'image' || fileType.includes('image')) {
                        if (previewBody) previewBody.innerHTML = `<img src="${file.url}" class="preview-image" alt="${file.name}">`;
                    } else if (fileType.includes('pdf')) {
                        // 使用Google Docs预览PDF
                        const googleDocsUrl = `https://docs.google.com/gview?url=${encodeURIComponent(file.url)}&embedded=true`;
                        if (previewBody) previewBody.innerHTML = `<iframe src="${googleDocsUrl}" class="preview-iframe"></iframe>`;
                    } else if (fileType.includes('text') || fileType.includes('txt')) {
                        const response = await fetch(file.url);
                        if (response.ok) {
                            const text = await response.text();
                            if (previewBody) previewBody.innerHTML = `<pre class="preview-text">${text}</pre>`;
                        } else {
                            throw new Error('加载失败');
                        }
                    } else if (isOfficeDocument(fileType, fileExt)) {
                        // 使用改进的Office文档预览方案
                        previewOfficeDocumentImproved(file);
                    } else {
                        showUnsupportedPreview(fileId);
                    }
                } catch (error) {
                    console.error('预览失败:', error);
                    showErrorPreview(fileId, error.message);
                }
            }
            
            // 判断是否为Office文档
            function isOfficeDocument(fileType, fileExt) {
                const officeTypes = [
                    'word', 'doc', 'docx', 
                    'excel', 'xls', 'xlsx', 'xlsm',
                    'powerpoint', 'ppt', 'pptx'
                ];
                
                return officeTypes.some(type => 
                    fileType.includes(type) || fileExt.includes(type)
                );
            }
            
            // 改进的Office文档预览方案
            function previewOfficeDocumentImproved(file) {
                // 方案1: 使用Microsoft Office Online
                const officeOnlineUrl = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(file.url)}`;
                
                // 方案2: 使用Google Docs作为备选
                const googleDocsUrl = `https://docs.google.com/gview?url=${encodeURIComponent(file.url)}&embedded=true`;
                
                if (previewBody) {
                    previewBody.innerHTML = `
                        <div style="width: 100%; height: 100%; display: flex; flex-direction: column;">
                            <div style="padding: 10px; background: #f5f5f5; border-bottom: 1px solid #ddd; font-size: 14px;">
                                <strong>提示：</strong> 这是一个在线预览，某些功能可能受限。如需完整功能，请下载后使用本地Office软件打开。
                                <div style="margin-top: 5px;">
                                    <button id="switchPreview" class="btn" style="padding: 5px 10px; font-size: 12px;">切换预览方式</button>
                                </div>
                            </div>
                            <iframe 
                                id="previewFrame"
                                src="${officeOnlineUrl}" 
                                class="preview-office" 
                                frameborder="0">
                            </iframe>
                        </div>
                    `;
                    
                    // 添加切换预览方式功能
                    const switchBtn = document.getElementById('switchPreview');
                    if (switchBtn) {
                        switchBtn.addEventListener('click', () => {
                            const frame = document.getElementById('previewFrame');
                            if (frame) {
                                if (frame.src.includes('officeapps.live.com')) {
                                    frame.src = googleDocsUrl;
                                } else {
                                    frame.src = officeOnlineUrl;
                                }
                            }
                        });
                    }
                }
            }
            
            // 显示不支持预览的提示
            function showUnsupportedPreview(fileId) {
                if (previewBody) {
                    previewBody.innerHTML = `
                        <div class="preview-notice">
                            <i class="fas fa-file"></i>
                            <p>此文件类型不支持在线预览</p>
                            <p>请下载后查看</p>
                            <button class="btn btn-download" onclick="downloadFile('${fileId}')" style="margin-top: 15px;">下载文件</button>
                        </div>
                    `;
                }
            }
            
            // 显示预览错误
            function showErrorPreview(fileId, errorMsg) {
                if (previewBody) {
                    previewBody.innerHTML = `
                        <div class="preview-notice">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>预览加载失败</p>
                            <p style="font-size: 14px; color: #999; margin: 10px 0;">${errorMsg}</p>
                            <button class="btn btn-download" onclick="downloadFile('${fileId}')">下载文件</button>
                        </div>
                    `;
                }
            }
            
            // 下载文件
            async function downloadFile(fileId, buttonElement) {
                const file = currentFiles.find(f => f.id === fileId);
                if (!file) {
                    showNotification('文件不存在！', 'error');
                    return;
                }
                
                // 保存按钮原始状态
                const originalHTML = buttonElement.innerHTML;
                const originalDisabled = buttonElement.disabled;
                
                try {
                    // 显示下载中状态
                    buttonElement.innerHTML = '<div class="loading"></div>';
                    buttonElement.disabled = true;
                    
                    // 使用fetch获取文件并创建下载链接
                    const response = await fetch(file.url);
                    if (!response.ok) {
                        throw new Error('文件下载失败');
                    }
                    
                    const blob = await response.blob();
                    const blobUrl = window.URL.createObjectURL(blob);
                    
                    // 创建下载链接
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = file.name;
                    a.style.display = 'none';
                    
                    // 添加到DOM并触发点击
                    document.body.appendChild(a);
                    a.click();
                    
                    // 清理
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(blobUrl);
                    
                    showNotification(`下载成功: ${file.name}`);
                    
                } catch (error) {
                    console.error('下载失败:', error);
                    
                    // 备用方案：直接使用原始URL
                    try {
                        const a = document.createElement('a');
                        a.href = file.url;
                        a.download = file.name;
                        a.style.display = 'none';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        showNotification(`开始下载: ${file.name}`);
                    } catch (fallbackError) {
                        console.error('备用下载方案也失败:', fallbackError);
                        showNotification('下载失败，请重试！', 'error');
                    }
                } finally {
                    // 确保按钮状态恢复
                    buttonElement.innerHTML = originalHTML;
                    buttonElement.disabled = originalDisabled;
                }
            }
            
            // 单个文件删除
            async function deleteFile(fileId, buttonElement) {
                if (!confirm('确定要删除这个文件吗？此操作不可撤销！')) return;
                
                // 保存按钮原始状态
                const originalHTML = buttonElement.innerHTML;
                const originalDisabled = buttonElement.disabled;
                
                try {
                    buttonElement.innerHTML = '<div class="loading"></div>';
                    buttonElement.disabled = true;
                    
                    await deleteSingleFile(fileId);
                    
                    selectedFileIds.delete(fileId);
                    updateSelectedCount();
                    
                    showNotification('文件删除成功！');
                } catch (error) {
                    console.error('删除文件失败:', error);
                    showNotification('文件删除失败，请重试！', 'error');
                } finally {
                    // 确保按钮状态恢复
                    buttonElement.innerHTML = originalHTML;
                    buttonElement.disabled = originalDisabled;
                }
            }
            
            // 批量删除文件
            if (batchDeleteBtn) {
                batchDeleteBtn.addEventListener('click', async () => {
                    if (selectedFileIds.size === 0) {
                        showNotification('请先选择要删除的文件！', 'error');
                        return;
                    }
                    
                    if (!confirm(`确定要删除选中的 ${selectedFileIds.size} 个文件吗？此操作不可撤销！`)) return;
                    
                    // 保存按钮原始状态
                    const originalHTML = batchDeleteBtn.innerHTML;
                    const originalDisabled = batchDeleteBtn.disabled;
                    
                    try {
                        batchDeleteBtn.innerHTML = '<div class="loading"></div> 删除中...';
                        batchDeleteBtn.disabled = true;
                        
                        const fileIds = Array.from(selectedFileIds);
                        let successCount = 0;
                        
                        for (const fileId of fileIds) {
                            try {
                                await deleteSingleFile(fileId);
                                successCount++;
                            } catch (error) {
                                console.error(`删除文件 ${fileId} 失败:`, error);
                            }
                        }
                        
                        selectedFileIds.clear();
                        updateSelectedCount();
                        
                        showNotification(`成功删除 ${successCount} 个文件！`);
                    } catch (error) {
                        console.error('批量删除失败:', error);
                        showNotification('批量删除失败，请重试！', 'error');
                    } finally {
                        // 确保按钮状态恢复
                        batchDeleteBtn.innerHTML = originalHTML;
                        batchDeleteBtn.disabled = originalDisabled;
                    }
                });
            }
            
            // 删除单个文件
            async function deleteSingleFile(fileId) {
                const file = currentFiles.find(f => f.id === fileId);
                
                if (file.type === 'folder') {
                    // 删除文件夹
                    try {
                        const folderObj = AV.Object.createWithoutData('Folder', fileId);
                        await folderObj.destroy();
                    } catch (error) {
                        console.warn('Folder类不存在，尝试使用fileType类删除:', error.message);
                        // 如果Folder类不存在，尝试使用fileType类删除
                        const fileObj = AV.Object.createWithoutData('fileType', fileId);
                        await fileObj.destroy();
                    }
                } else {
                    // 删除文件
                    const fileObj = AV.Object.createWithoutData('fileType', fileId);
                    const fileData = await fileObj.fetch();
                    const avFileId = fileData.get('fileId');
                    
                    await fileObj.destroy();
                    
                    if (avFileId) {
                        await deleteFileFromStorage(avFileId);
                    }
                }
                
                currentFiles = currentFiles.filter(file => file.id !== fileId);
                renderFileList(currentFiles);
            }
            
            // 从LeanCloud存储中删除文件
            async function deleteFileFromStorage(fileId) {
                try {
                    const response = await fetch(`${SERVER_URL}/1.1/files/${fileId}`, {
                        method: 'DELETE',
                        headers: {
                            'X-LC-Id': APP_ID,
                            'X-LC-Key': `${MASTER_KEY},master`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    return response.ok;
                } catch (error) {
                    console.warn('文件存储清理失败:', error);
                    return false;
                }
            }
            
            // 全选复选框事件
            if (selectAllCheckbox) {
                selectAllCheckbox.addEventListener('change', (e) => {
                    toggleSelectAll(e.target.checked);
                });
            }
            
            // 按回车键搜索
            if (searchInput) {
                searchInput.addEventListener('keyup', (e) => {
                    if (e.key === 'Enter' && searchBtn) {
                        searchBtn.click();
                    }
                });
            }
            
            // 按回车键登录
            if (loginUsername) {
                loginUsername.addEventListener('keyup', (e) => {
                    if (e.key === 'Enter' && loginSubmit) {
                        loginSubmit.click();
                    }
                });
            }
            
            if (loginPassword) {
                loginPassword.addEventListener('keyup', (e) => {
                    if (e.key === 'Enter' && loginSubmit) {
                        loginSubmit.click();
                    }
                });
            }
            
            if (registerPassword) {
                registerPassword.addEventListener('keyup', (e) => {
                    if (e.key === 'Enter' && registerSubmit) {
                        registerSubmit.click();
                    }
                });
            }
            
            // 按回车键创建文件夹
            if (folderName) {
                folderName.addEventListener('keyup', (e) => {
                    if (e.key === 'Enter' && createFolder) {
                        createFolder.click();
                    }
                });
            }
            
            // 初始化面包屑
            updateBreadcrumb();
            
            // 如果用户已登录，加载文件
            if (AV.User.current()) {
                loadFiles();
            }
        }
    </script>
</body>
</html>
