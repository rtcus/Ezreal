<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - Ezreal工具箱</title>
    <!-- 引入外部资源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        dark: '#1E293B'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            min-height: 100vh;
        }
        .bg-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .home-btn {
            background: linear-gradient(45deg, #3B82F6, #6366F1);
            transition: all 0.3s ease;
        }
        .home-btn:hover {
            background: linear-gradient(45deg, #2563EB, #4F46E5);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="text-white font-sans flex items-center justify-center">
    <!-- 背景网格效果 -->
    <div class="fixed inset-0 bg-grid pointer-events-none opacity-30"></div>
    
    <!-- 404 内容 -->
    <div class="container mx-auto px-4 py-16 text-center relative z-10">
        <div class="glass-effect rounded-xl p-8 md:p-12 max-w-2xl mx-auto">
            <div class="text-9xl font-bold text-primary/30 mb-4">404</div>
            <h1 class="text-3xl md:text-4xl font-bold mb-4">页面未找到</h1>
            <p class="text-gray-300 mb-8">抱歉，您访问的页面不存在或已被移除</p>
            <a href="index.html" class="home-btn inline-flex items-center px-8 py-4 rounded-lg text-white font-bold text-lg">
                <i class="fa fa-home mr-2"></i>返回首页
            </a>
        </div>
        
        <!-- 装饰元素 -->
        <div class="absolute top-1/4 left-1/4 w-32 h-32 rounded-full bg-primary/10 blur-3xl -z-10"></div>
        <div class="absolute bottom-1/4 right-1/4 w-40 h-40 rounded-full bg-indigo-500/10 blur-3xl -z-10"></div>
    </div>
</body>
</html>
